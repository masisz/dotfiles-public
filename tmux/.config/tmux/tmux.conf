set -g default-terminal "tmux-256color"
set-option -a terminal-features 'tmux-256color:RGB'
set-option -a terminal-overrides 'tmux-256color:Tc'
set-option -g mouse on
set-window-option -g mode-keys vi

# copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection

if-shell "uname | grep -q Darwin" {
    # macOS
    bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
} {
    # Linux
    bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard'
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -selection clipboard'
}

set-option -sg escape-time 10
set-option -g focus-events on

# under curl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# change keybind to split window
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# reload configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

bind i run-shell "tmux refresh-client -S"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically save sessions for every 15 minutes.
set -g @plugin 'catppuccin/tmux#latest'
set -g @catppuccin_flavor 'mocha'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Custom theme (optional)
# source-file "~/.config/tmux/themes/wisteria.conf"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Zellij-inspired status bar
set -g status 2
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#11111b,fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=#11111b,bg=#89b4fa,bold] MODE #[fg=#cdd6f4,bg=#313244] #{?client_prefix,PREFIX,NORMAL} #[fg=#11111b,bg=#a6e3a1,bold] #S '
set -g status-right '#[fg=#11111b,bg=#f9e2af,bold] PANE #{pane_index} #[fg=#11111b,bg=#94e2d5,bold] %Y-%m-%d #[fg=#11111b,bg=#cba6f7,bold] %H:%M '

# Keep the first status row for windows; use the second for contextual help.
# Tree mode handles these keys directly, without the Ctrl+B prefix.
set -g status-format[1] '#[align=left,fg=#a6adc8,bg=#11111b] #{?#{==:#{pane_mode},tree-mode},#[fg=#f9e2af]WINDOWS#[default]  Up/Down:move  Enter:select  +/-:expand/fold  x:delete  q:back  Ctrl+s:search  v:preview  F1:help,#[fg=#89b4fa]Ctrl+B#[default] then  w:windows  c:new  n/p:next/prev  |/-:split  arrows:pane  z:zoom  ?:help}'

set -g window-status-separator ''
set -g window-status-format '#[fg=#cdd6f4,bg=#181825] #I:#W#{?window_flags,#{window_flags}, } '
set -g window-status-current-format '#[fg=#11111b,bg=#f38ba8,bold] #I:#W#{?window_flags,#{window_flags}, } '

set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format '#[fg=#6c7086,bg=default] #{pane_index}: #{pane_current_command} '
set -g pane-border-style 'fg=#6c7086'
set -g pane-active-border-style 'fg=#89b4fa,bold'
set -g message-style 'fg=#11111b,bg=#89b4fa,bold'
set -g mode-style 'fg=#11111b,bg=#f9e2af,bold'
